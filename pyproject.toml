[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-microphone-plugin-pyaudio"
dynamic = ["version"]
description = "PyAudio (PortAudio) microphone plugin for OVOS"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
keywords = ["ovos", "plugin", "listener", "microphone", "pyaudio"]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-config",
    "pyaudio",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-microphone-plugin-pyaudio"

[project.entry-points."opm.microphone"]
ovos-microphone-plugin-pyaudio = "ovos_microphone_plugin_pyaudio:PyAudioMicrophone"

[tool.setuptools.packages.find]
include = ["ovos_microphone_plugin_pyaudio*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_microphone_plugin_pyaudio.version.__version__"}
